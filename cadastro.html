<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
        input, textarea, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; cursor: pointer; border: none; }
        a { display: block; margin-bottom: 20px; }
    </style>
</head>
<body>

    <a href="index.html">⬅ Voltar para a lista</a>
    <h1>Cadastrar Produto</h1>

    <form id="form-cadastro">
        <input type="text" id="nome" placeholder="Nome do Produto" required>
        <input type="number" step="0.01" id="preco" placeholder="Preço (ex: 10.50)" required>
        <textarea id="descricao" placeholder="Descrição do Produto" rows="4"></textarea>
        <button type="submit">Salvar Produto</button>
    </form>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault(); // Evita que a página recarregue

            // Pega os valores do formulário
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;
            const descricao = document.getElementById('descricao').value;

            // Envia para o backend
            try {
                const resposta = await fetch('http://localhost:3000/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, preco, descricao })
                });

                if (resposta.ok) {
                    alert('Produto cadastrado com sucesso!');
                    window.location.href = 'index.html'; // Redireciona para a lista
                } else {
                    alert('Erro ao cadastrar produto.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
