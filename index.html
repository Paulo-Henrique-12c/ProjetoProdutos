<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ver Produtos</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; padding: 20px; color: #fff;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://tse1.mm.bing.net/th/id/OIP.xZgDfLtg17E6LwokuXuF8AHaEK?rs=1&pid=ImgDetMain&o=7&rm=3') no-repeat center center fixed; 
            background-size: cover;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; text-transform: uppercase; text-shadow: 3px 3px #000; border-bottom: 4px solid #fff; padding-bottom: 10px; }
        
        .nav-link { 
            text-decoration: none; background: #fff; color: #000; padding: 12px 20px; 
            border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 25px;
            transition: 0.3s; border: 2px solid #fff;
        }
        .nav-link:hover { background: transparent; color: #fff; }

        .produto { 
            background: rgba(255, 255, 255, 0.9); color: #000; padding: 20px; 
            border-radius: 8px; border-left: 12px solid #000; margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .produto h3 { margin: 0; color: #111; font-size: 1.4em; }
        .produto p { color: #333; margin: 10px 0; }
        
        .btn-apagar { 
            background: #000; color: #fff; border: 2px solid #cc0000; padding: 8px 15px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-apagar:hover { background: #cc0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ver Produtos</h1>
        <a href="cadastro.html" class="nav-link">✚ CADASTRAR NOVO ITEM</a>
        <div id="lista-produtos">Carregando...</div>
    </div>

    <script>
        async function carregarProdutos() {
            try {
                const resposta = await fetch('http://localhost:3000/produtos');
                const produtos = await resposta.json();
                const divLista = document.getElementById('lista-produtos');
                divLista.innerHTML = ''; 
                produtos.forEach(p => {
                    divLista.innerHTML += `
                        <div class="produto">
                            <h3>⚽ ${p.nome} — R$ ${p.preco}</h3>
                            <p>${p.descricao}</p>
                            <button class="btn-apagar" onclick="deletarProduto(${p.id})">APAGAR</button>
                        </div>`;
                });
            } catch (e) { document.getElementById('lista-produtos').innerHTML = 'Erro ao carregar.'; }
        }

        async function deletarProduto(id) {
            if (confirm("Deseja mesmo remover este item do estoque?")) {
                const res = await fetch(`http://localhost:3000/produtos/${id}`, { method: 'DELETE' });
                if (res.ok) { alert('Removido! Vai Corinthians!'); carregarProdutos(); }
            }
        }
        carregarProdutos();
    </script>
</body>
</html>
